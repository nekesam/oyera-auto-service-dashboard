<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f5f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .logout-card {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            text-align: center;
            max-width: 360px;
        }

        .logout-card i {
            font-size: 48px;
            color: #2563eb;
            margin-bottom: 16px;
        }

        .logout-card a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="logout-card">
        <i class="fa-solid fa-right-from-bracket"></i>
        <h1>You've been logged out</h1>
        <p>Thanks for using Oyera Auto Service Bay.</p>
        <a href="../login.html">Log In Again</a>
    </div>
    <script>
        localStorage.removeItem("oyeraLoggedIn");
        localStorage.removeItem("oyeraUsername");
    </script>
</body>

</html>
