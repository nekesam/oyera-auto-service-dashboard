<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Oyera Auto Service Bay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f5f8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
            text-align: center;
            width: 100%;
            max-width: 360px;
        }

        .login-card img {
            height: 48px;
            margin-bottom: 12px;
        }

        .login-card h1 {
            font-size: 1.4rem;
            margin: 0 0 4px;
        }

        .login-card p {
            color: #6b7280;
            margin: 0 0 24px;
            font-size: 0.9rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;
        }

        .input-error {
            border-color: #dc2626 !important;
            background-color: #fef2f2;
        }

        .error-message {
            display: block;
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .form-success {
            display: none;
            color: #15803d;
            background-color: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <img src="images/service-logo.png" alt="Oyera Auto Service Bay Logo">
        <h1>Welcome back</h1>
        <p>Log in to manage the service bay.</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input type="email" id="loginEmail" placeholder="john@oasbay.com">
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button type="submit">Log In</button>
        </form>
    </div>

    <script src="js/validation.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
